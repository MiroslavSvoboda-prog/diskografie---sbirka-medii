{% extends 'sbirka/base.html' %}

{% block title %}Smazat film – Diskografie{% endblock %}

{% block content %}
    <h1>Opravdu chceš smazat film "{{ film.nazev }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Ano, smazat</button>
        <a href="{% url 'sbirka:film_detail' pk=film.pk %}">Zrušit</a>
    </form>
{% endblock %}
