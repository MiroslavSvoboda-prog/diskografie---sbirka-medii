{% extends 'sbirka/base.html' %}

{% block title %}
    {% if album %}Upravit album{% else %}Nové album{% endif %} – Diskografie
{% endblock %}

{% block content %}
    <h1>{% if album %}Upravit album{% else %}Nové album{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Uložit</button>
    </form>
    <p><a href="{% url 'sbirka:album_list' %}">← Zpět na seznam alb</a></p>
{% endblock %}
