{% extends 'sbirka/base.html' %}

{% block title %}Smazat album – Diskografie{% endblock %}

{% block content %}
    <div class="delete-panel">
        <h1>Opravdu chceš smazat album „{{ album.nazev }}“?</h1>
        <p>Tuto akci nelze vzít zpět.</p>
        <form method="post" class="form-actions">
            {% csrf_token %}
            <button type="submit" class="btn btn--danger">Ano, smazat</button>
            <a class="btn btn--secondary" href="{% url 'sbirka:album_detail' pk=album.pk %}">Zrušit</a>
        </form>
    </div>
{% endblock %}
