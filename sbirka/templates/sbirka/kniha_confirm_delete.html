{% extends 'sbirka/base.html' %}

{% block title %}Smazat knihu – Diskografie{% endblock %}

{% block content %}
    <h1>Opravdu chceš smazat knihu "{{ kniha.nazev }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Ano, smazat</button>
        <a href="{% url 'sbirka:kniha_detail' pk=kniha.pk %}">Zrušit</a>
    </form>
{% endblock %}
