{% extends 'sbirka/base.html' %}

{% block title %}Smazat album – Diskografie{% endblock %}

{% block content %}
    <h1>Opravdu chceš smazat album "{{ album.nazev }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Ano, smazat</button>
        <a href="{% url 'sbirka:album_detail' pk=album.pk %}">Zrušit</a>
    </form>
{% endblock %}
