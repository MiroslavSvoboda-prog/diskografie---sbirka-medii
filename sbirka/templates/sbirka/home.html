{% extends 'sbirka/base.html' %}

{% block title %}Domů – Diskografie{% endblock %}

{% block content %}
    <h1>Moje sbírka</h1>
    <p class="home-subtitle">Přehled tvých alb, filmů a knih na jednom místě.</p>

    <div class="home-tiles">
        <a class="home-tile home-tile--album" href="{% url 'sbirka:album_list' %}">
            <span class="home-tile__label">Alba</span>
            <span class="home-tile__count">{{ pocet_alb }}</span>
            <span class="home-tile__link">Zobrazit →</span>
        </a>
        <a class="home-tile home-tile--film" href="{% url 'sbirka:film_list' %}">
            <span class="home-tile__label">Filmy</span>
            <span class="home-tile__count">{{ pocet_filmu }}</span>
            <span class="home-tile__link">Zobrazit →</span>
        </a>
        <a class="home-tile home-tile--kniha" href="{% url 'sbirka:kniha_list' %}">
            <span class="home-tile__label">Knihy</span>
            <span class="home-tile__count">{{ pocet_knih }}</span>
            <span class="home-tile__link">Zobrazit →</span>
        </a>
    </div>
{% endblock %}
