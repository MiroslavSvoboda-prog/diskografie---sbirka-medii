{% extends 'sbirka/base.html' %}

{% block title %}
    {% if kniha %}Upravit knihu{% else %}Nová kniha{% endif %} – Diskografie
{% endblock %}

{% block content %}
    <div class="form-panel form-panel--kniha">
        <h1>{% if kniha %}Upravit knihu{% else %}Nová kniha{% endif %}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Uložit</button>
        </form>
    </div>
    <p><a class="btn btn--secondary" href="{% url 'sbirka:kniha_list' %}">← Zpět na seznam knih</a></p>
{% endblock %}
